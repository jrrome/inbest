spring.application.name=inbest
# Ruta relativa al directorio de ejecución del backend
spring.docker.compose.file=compose.yaml
spring.flyway.locations=classpath:db/migration
# Para que JPA no modifique el esquema de la bd, solo flyway
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.url=jdbc:postgresql://localhost:5432/inbest
spring.datasource.username=inbest
spring.datasource.password=inbest

# Buzón SMTP local de desarrollo (Mailpit)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000

# Blockchain
inbest.blockchain.rpc-url=http://localhost:8545
inbest.blockchain.chain-id=31337
inbest.blockchain.admin-private-key=${INBEST_ADMIN_PRIVATE_KEY:0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/inbest
spring.security.oauth2.resourceserver.jwt.audiences=inbest-api