spring.application.name=inbest
# Ruta relativa al directorio de ejecución del backend
spring.docker.compose.file=../compose.yaml
spring.flyway.locations=classpath:db/migration
# Para que JPA no modifique el esquema de la bd, solo flyway
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.url=jdbc:postgresql://localhost:5432/inbest
spring.datasource.username=inbest
spring.datasource.password=inbest

# Buzón SMTP local de desarrollo (Mailpit)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000
inbest.auth.mail-from=no-reply@inbest.local
inbest.auth.base-url=http://localhost:8080
server.servlet.session.timeout=30m
server.servlet.session.cookie.same-site=lax
