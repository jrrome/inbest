services:
  postgres:
    image: 'postgres:18'
    environment:
      - 'POSTGRES_DB=inbest'
      - 'POSTGRES_PASSWORD=inbest'
      - 'POSTGRES_USER=inbest'
    ports:
      - '5432:5432'
    # Esto es para persistencia, si se borra el contenedor, la bd sigue ahí almacenada
    volumes:
      - postgres-data:/var/lib/postgresql
    # Health checks, comprueba que la bd acepte conexiones
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inbest -d inbest"]
      interval: 5s
      timeout: 5s
      retries: 10

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    # El contenedor ejecuta anvil
    entrypoint: [ "anvil" ]
    command: [ "--host", "0.0.0.0", "--chain-id", "31337" ]
    ports:
      - "8545:8545"
    working_dir: /workspace
    volumes:
      - ./blockchain:/workspace
    healthcheck:
      test:
        [ "CMD", "cast", "chain-id", "--rpc-url", "http://127.0.0.1:8545" ]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27.4
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak-postgres:
    image: 'postgres:18'
    environment:
      - 'POSTGRES_DB=keycloak'
      - 'POSTGRES_PASSWORD=keycloak'
      - 'POSTGRES_USER=keycloak'
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql
    # -h fuerza tcp para no dar por buena la bd durante la inicializacion
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U keycloak -d keycloak" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - keycloak
    labels:
      org.springframework.boot.ignore: "true"

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      - 'KC_HEALTH_ENABLED=true'
      - 'KC_METRICS_ENABLED=true'
      - 'KC_DB=postgres'
      - 'KC_DB_URL=jdbc:postgresql://keycloak-postgres:5432/keycloak'
      - 'KC_DB_USERNAME=keycloak'
      - 'KC_DB_PASSWORD=keycloak'
      - 'KC_HOSTNAME=http://localhost:8081'
      - 'KC_BOOTSTRAP_ADMIN_USERNAME=admin'
      - 'KC_BOOTSTRAP_ADMIN_PASSWORD=admin'
    working_dir: /opt/keycloak
    ports:
      - '127.0.0.1:8081:8080'
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    networks:
      default:
      keycloak:

networks:
  keycloak:
    internal: true

volumes:
  postgres-data:
  keycloak-postgres-data:
